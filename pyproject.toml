[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokecatch-cli-game"
version = "1.0.0"
description = "A terminal-based Pokemon catching game"
readme = "Readme.md"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10,<11",
    "rich>=13",
    "term-image>=0.7"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Topic :: Games"
]

[project.scripts]
pokecatch = "pokecatch.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pokecatch*"]

[tool.setuptools.package-data]
pokecatch = [
    "data/*.json",
    "sprites/pokemons/*.png"
]